<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Crawler Buddy</title>
  <script type="importmap">
    {
      "imports": {
        "three": "./node_modules/three/build/three.module.js",
        "three/addons/": "./src/vendor/three-addons/"
      }
    }
  </script>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
    canvas { width: 100%; height: 100%; display: block; cursor: grab; }
    #bubble {
      position: absolute; left: 50%; top: 8px; transform: translateX(-50%);
      max-width: 260px; padding: 6px 10px; font: 600 12px/1.3 "Bahnschrift", "Segoe UI", sans-serif;
      color: #dff6ff; background: rgba(4, 12, 30, 0.88); border: 1px solid #48d8ff;
      box-shadow: 0 0 12px rgba(72, 216, 255, 0.5); letter-spacing: 0.04em; text-transform: uppercase;
      opacity: 0; transition: opacity 0.3s; pointer-events: none; text-align: center;
    }
    #bubble.show { opacity: 1; }
    #close {
      position: absolute; right: 6px; top: 6px; width: 20px; height: 20px; border: 0; border-radius: 50%;
      background: rgba(4, 12, 30, 0.7); color: #48d8ff; cursor: pointer; opacity: 0; transition: opacity 0.2s;
    }
    body:hover #close { opacity: 1; }
  </style>
</head>
<body>
  <canvas id="buddy-canvas"></canvas>
  <div id="bubble"></div>
  <button id="close" title="Send them home">×</button>
  <script type="module" src="src/buddy.js"></script>
</body>
</html>

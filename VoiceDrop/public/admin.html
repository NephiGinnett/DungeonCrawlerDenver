<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Drop Admin</title>
<style>
  :root { --bg: #0d0b14; --panel: #17131f; --panel2: #1f1a2b; --line: #2e2740; --ink: #efe9f7; --dim: #a79fb8;
    --accent: #ff4fa3; --good: #6be07a; --warn: #ffb347; --bad: #ff6b6b; --ship: #43e6d0; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1000px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { margin: 0 0 16px; font-size: 24px; } h1 span { color: var(--accent); }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; align-items: center; }
  .tab { background: var(--panel); border: 1px solid var(--line); color: var(--ink); border-radius: 999px; padding: 6px 14px; cursor: pointer; font: inherit; }
  .tab.on { border-color: var(--accent); color: var(--accent); }
  .count { color: var(--dim); margin-left: auto; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
  .card.flash { border-color: var(--accent); }
  .top { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--dim); font-size: 13px; }
  .top b { color: var(--ink); font-size: 15px; }
  .pill { border-radius: 999px; padding: 1px 9px; font-size: 12px; font-weight: 600; color: #120f19; }
  .pill.new { background: var(--warn); } .pill.approved { background: var(--good); } .pill.shipped { background: var(--ship); } .pill.rejected { background: var(--bad); }
  .pill.open { background: transparent; color: var(--dim); border: 1px solid var(--line); }
  /* the Progress tab */
  .card .bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--panel2); margin: 10px 0; }
  .card .bar i { display: block; height: 100%; }
  .pline { display: grid; grid-template-columns: 92px 120px 1fr; gap: 10px; align-items: baseline; padding: 5px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .pline .pill { text-align: center; }
  .pline .who { color: var(--ink); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pline .what { color: var(--dim); }
  @media (max-width: 640px) { .pline { grid-template-columns: 86px 1fr; } .pline .what { grid-column: 1 / -1; } }
  .text { margin: 8px 0; font-size: 16px; }
  .note { color: var(--warn); font-size: 14px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
  audio { height: 34px; }
  button.act { border: 0; border-radius: 8px; padding: 6px 12px; font: 600 13px system-ui, sans-serif; cursor: pointer; color: #120f19; }
  .ok { background: var(--good); } .ship { background: var(--ship); } .no { background: var(--bad); } .plain { background: #cfc8dc; }
  input.small { width: 70px; } input.name { width: 150px; }
  input { background: var(--panel2); border: 1px solid var(--line); color: var(--ink); border-radius: 6px; padding: 5px 8px; font: inherit; }
  a { color: var(--ship); }
  #login { max-width: 360px; margin: 80px auto; }
  #login input { width: 100%; margin: 8px 0; padding: 10px; }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <div id="login" class="card hidden">
    <h1>Voice <span>Drop</span> admin</h1>
    <p>Admin password (the ADMIN_TOKEN you set when deploying):</p>
    <input type="password" id="token" autocomplete="current-password">
    <button class="act ok" id="go">Open</button>
    <p id="loginErr" class="note"></p>
  </div>

  <div id="app" class="hidden">
    <h1>Voice <span>Drop</span> admin</h1>
    <div class="bar" id="tabs"></div>
    <div id="list"></div>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
let token = "";
try { token = localStorage.getItem("voiceDropAdmin") || ""; } catch {}
let filter = "progress";
// "progress" is the overview: every character, who voices it, and where each line stands (2026-11-22).
const STATUSES = ["progress", "new", "approved", "shipped", "rejected", "all"];
const STATE_LABEL = { open: "Open", review: "In review", taken: "Approved", done: "Shipped" };

async function api(path, options = {}) {
  const res = await fetch(path, { ...options, headers: { "x-admin-token": token, "Content-Type": "application/json", ...(options.headers || {}) } });
  if (res.status === 401) { showLogin("That password didn't work."); throw new Error("401"); }
  return res.json();
}
function esc(s) { return String(s || "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function showLogin(msg) {
  $("app").classList.add("hidden");
  $("login").classList.remove("hidden");
  $("loginErr").textContent = msg || "";
}
$("go").onclick = () => {
  token = $("token").value.trim();
  try { localStorage.setItem("voiceDropAdmin", token); } catch {}
  start();
};
$("token").addEventListener("keydown", (e) => e.key === "Enter" && $("go").click());

function tabs() {
  $("tabs").innerHTML = "";
  for (const s of STATUSES) {
    const b = document.createElement("button");
    b.className = "tab" + (s === filter ? " on" : "");
    b.textContent = s[0].toUpperCase() + s.slice(1);
    b.onclick = () => { filter = s; render(); };
    $("tabs").appendChild(b);
  }
  const c = document.createElement("span");
  c.className = "count";
  c.id = "count";
  $("tabs").appendChild(c);
}

async function render() {
  tabs();
  if (filter === "progress") return renderProgress();
  const list = await api("/api/admin/submissions?status=" + filter);
  $("count").textContent = `${list.length} take${list.length === 1 ? "" : "s"}`;
  const box = $("list");
  box.innerHTML = list.length ? "" : '<p class="note">Nothing here.</p>';
  for (const s of list) box.appendChild(card(s));
  const hash = location.hash.slice(1);
  if (hash) { const el = document.getElementById("s_" + hash); if (el) { el.classList.add("flash"); el.scrollIntoView({ block: "center" }); } }
}

// Every character: who voices it, a bar, and each line's state. Approve a take and its line turns "Approved" here and
// "Taken" on the public site; ship it (voice_inbox.py pull) and both say it is in the game.
async function renderProgress() {
  const list = await api("/api/admin/progress");
  const sum = { open: 0, review: 0, taken: 0, done: 0, total: 0 };
  list.forEach((sp) => Object.keys(sum).forEach((k) => { sum[k] += sp.counts[k]; }));
  $("count").textContent = `${sum.done} shipped · ${sum.taken} approved · ${sum.review} in review · ${sum.open} open of ${sum.total}`;
  const box = $("list");
  box.innerHTML = "";
  for (const sp of list) {
    const c = sp.counts;
    const pct = (n) => (c.total ? (n / c.total) * 100 : 0) + "%";
    const el = document.createElement("div");
    el.className = "card";
    el.innerHTML = `
      <div class="top"><b>${esc(sp.name)}</b>
        <span>${sp.castBy ? "Voiced by <b>" + esc(sp.castBy) + "</b>" : "Not cast yet"}</span>
        <span>${c.done} shipped · ${c.taken} approved · ${c.review} in review · ${c.open} open</span></div>
      <div class="bar"><i style="width:${pct(c.done)};background:var(--ship)"></i><i style="width:${pct(c.taken)};background:var(--good)"></i><i style="width:${pct(c.review)};background:var(--warn)"></i></div>
      <div class="lines"></div>`;
    const lines = el.querySelector(".lines");
    for (const l of sp.lines) {
      const row = document.createElement("div");
      row.className = "pline";
      row.innerHTML = `<span class="pill ${l.state === "done" ? "shipped" : l.state === "taken" ? "approved" : l.state === "review" ? "new" : "open"}">${STATE_LABEL[l.state]}</span>
        <span class="who">${l.by ? esc(l.by) : l.review ? l.review + " waiting" : ""}</span><span class="what">${esc(l.text)}</span>`;
      if (l.state === "review") {
        row.style.cursor = "pointer";
        row.title = "Open the takes waiting for this line";
        row.onclick = () => { filter = "new"; render(); };
      }
      lines.appendChild(row);
    }
    box.appendChild(el);
  }
}

function card(s) {
  const el = document.createElement("div");
  el.className = "card";
  el.id = "s_" + s.id;
  const audioUrl = `/api/admin/audio/${s.id}?token=${encodeURIComponent(token)}`;
  el.innerHTML = `
    <div class="top">
      <span class="pill ${s.status}">${s.status}</span>
      <b>${esc(s.speakerName)}</b><span>${esc(s.row)}</span>
      <span>by <b>${esc(s.name)}</b>${s.gameName ? ` (plays as ${esc(s.gameName)})` : ""}</span>
      ${s.contact ? `<span>${esc(s.contact)}</span>` : ""}
      <span>${new Date(s.createdAt).toLocaleString()}</span>
    </div>
    <p class="text">${esc(s.text)}</p>
    ${s.note ? `<p class="note">Their note: ${esc(s.note)}</p>` : ""}
    <div class="row">
      <audio controls preload="none" src="${audioUrl}"></audio>
      <a href="${audioUrl}&download=1">Download</a>
    </div>
    <div class="row">
      <label>Tickets <input class="small" type="number" min="0" max="1000" value="${s.reward}" data-f="reward"></label>
      <label>Game name <input class="name" type="text" value="${esc(s.gameName)}" data-f="gameName" placeholder="who gets the tickets"></label>
      <button class="act ok" data-s="approved">Approve</button>
      <button class="act ship" data-s="shipped">Mark shipped</button>
      <button class="act no" data-s="rejected">Reject</button>
      <button class="act plain" data-s="new">Back to new</button>
      <button class="act no" data-del>Delete</button>
    </div>`;
  const fields = () => ({ reward: el.querySelector('[data-f="reward"]').value, gameName: el.querySelector('[data-f="gameName"]').value });
  el.querySelectorAll("[data-s]").forEach((b) => b.onclick = async () => {
    await api(`/api/admin/submissions/${s.id}`, { method: "POST", body: JSON.stringify({ ...fields(), status: b.dataset.s }) });
    render();
  });
  el.querySelectorAll("[data-f]").forEach((input) => input.onchange = () =>
    api(`/api/admin/submissions/${s.id}`, { method: "POST", body: JSON.stringify(fields()) }));
  el.querySelector("[data-del]").onclick = async () => {
    if (!confirm("Delete this take for good? The file goes too.")) return;
    await api(`/api/admin/submissions/${s.id}`, { method: "DELETE" });
    render();
  };
  return el;
}

async function start() {
  if (!token) return showLogin();
  try {
    await api("/api/admin/submissions?status=new");
  } catch { return; }
  $("login").classList.add("hidden");
  $("app").classList.remove("hidden");
  render();
}
start();
</script>
</body>
</html>

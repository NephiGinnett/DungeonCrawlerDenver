; -----------------------------------------------------------------------------
; TEXTURE SIZE CAPS
;
; Added 2026-08-18 to fix a hard framerate problem: 7 FPS with GPU 99%, CPU 98%
; and a Windows memory-pressure warning, all at once.
;
; The cause was measured, not guessed. Cave_Camp - which Room 01 is built from -
; is 1.76 GB, and 1713 MB of that (97%) is textures. Twelve individual textures
; exceed 40 MB, several sit at 92-99 MB, and a 99 MB normal map is an
; uncompressed 8K. There are three of those just for cave rocks. Legendary_Forge
; (1.25 GB), Modern_villa_kit (1.12 GB), Ice_Station (774 MB) and Diner (656 MB)
; are all loaded by the same level.
;
; Marketplace packs ship at 4K-8K because they are photographed for hero shots.
; None of it survives being looked at from six metres away in a dungeon.
;
; WHY THIS AND NOT THE PER-ASSET SETTING:
; Capping Maximum Texture Size on each offending asset is the tidier fix and
; also shrinks them on disk - but it needs the editor's asset tools, which have
; been unavailable. This gets the framerate back now and costs nothing to keep.
; The two are compatible; do the per-asset pass as well when convenient.
;
; SCOPE - environment only, deliberately:
;   World / WorldNormalMap / WorldSpecular  -> capped at 2048
;   Character groups                        -> untouched
; The crawlers are the things players actually look at closely, so they keep
; their full resolution. Cave walls do not need it.
;
; TO REVERT: delete this file. Nothing else references it, no asset is modified,
; and no import is re-run. It is purely a load-time ceiling.
;
; TO TUNE: 1024 roughly halves the memory again and is still fine for
; environment at gameplay distance. 4096 if a specific surface looks soft.
; -----------------------------------------------------------------------------

[Windows DeviceProfile]
DeviceType=Windows
BaseProfileName=

+TextureLODGroups=(Group=TEXTUREGROUP_World,MinLODSize=1,MaxLODSize=2048,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
+TextureLODGroups=(Group=TEXTUREGROUP_WorldNormalMap,MinLODSize=1,MaxLODSize=2048,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
+TextureLODGroups=(Group=TEXTUREGROUP_WorldSpecular,MinLODSize=1,MaxLODSize=2048,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)

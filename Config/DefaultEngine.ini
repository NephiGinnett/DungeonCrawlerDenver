; cast of Meshy-imported characters, each of which keeps at least one LOD
; always resident for ray tracing (r.RayTracing.NumAlwaysResidentLODs).
; Raised after the always-resident set alone hit 208.8 MB, over half the old
; budget before anything dynamic needed room - the editor's on-screen warning
; fires past 20% (80 MB), so 208.8 MB was already flagging hard. This only
; raises a memory ceiling; it does not change any rendering behavior.

; Item classification tags - FDCCEquipmentDef::Tags and FDCCConsumableDef::Tags
; (Source/DungeonCrawlerDenver/Equipment/DCCEquipmentTypes.h,
; Source/DungeonCrawlerDenver/Items/DCCConsumableTypes.h).
;
; Registered here rather than left to be typed free-form in a DataTable cell:
; FGameplayTagContainer only accepts tags that exist in this dictionary, so an
; unregistered tag on a CSV row fails to import (or imports empty) rather than
; silently working. This is the starter set Zoe asked for when she asked for
; "a wealth of tags" on anything created - add more here freely, no C++
; change needed, just an editor restart to pick them up.
;
; Not read by any code yet. This is the classification layer for crafting/
; interaction systems that don't exist yet, authored ahead of time so items
; don't need re-tagging later.

[/Script/GameplayTags.GameplayTagsSettings]
+GameplayTagList=(Tag="Item.Consumable",DevComment="Drunk, eaten, or otherwise used up in one action - see FDCCConsumableDef")
+GameplayTagList=(Tag="Item.Liquid",DevComment="A drink, or anything else that pours/spills")
+GameplayTagList=(Tag="Item.Alcohol",DevComment="Alcoholic drink - implies Item.Liquid")
+GameplayTagList=(Tag="Item.Flammable",DevComment="Burns or ignites - relevant to fire VFX/hazards")
+GameplayTagList=(Tag="Item.Organic",DevComment="Food, plant matter, or anything else that was alive")
+GameplayTagList=(Tag="Item.Craftable",DevComment="A valid ingredient/component for a future crafting system")
+GameplayTagList=(Tag="Item.Weapon",DevComment="Equippable to MainHand or OffHand as a weapon")
+GameplayTagList=(Tag="Item.Armor",DevComment="Equippable to Head/Body as protection")
+GameplayTagList=(Tag="Item.Trinket",DevComment="Equippable to the Trinket slot")
+GameplayTagList=(Tag="Item.QuestItem",DevComment="Tied to a specific quest rather than general-purpose loot")
